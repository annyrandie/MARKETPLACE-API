openapi: 3.0.3

info:
  title: Marketplace API
  version: 1.0.0
  description: >
    Marketplace API contract — the source of truth for the DB schema (HW #12),
    entities (HW #13), the transactional order-checkout logic (HW #14), and
    the contract/E2E suite (HW #16). Every operation here is actually
    implemented in `app.js`, not declared just in case.

servers:
  - url: http://localhost:3000
    description: Local app running variant B

# Public by default (catalog reads, login). HW #24: operations that act
# on behalf of a user declare `security: [bearerAuth: []]` — an ES256
# access token from POST /auth/login. 401 = no/invalid/revoked token
# (refresh and retry); 403 = valid token, not allowed (don't refresh).
# HW #23's cookie session (`sessionCookie`) guards only /sessions/current.
security: []

tags:
  - name: products
    description: Product catalog
  - name: orders
    description: Placing and viewing orders
  - name: sessions
    description: Redis-backed sessions with a rolling idle timeout (HW #23)
  - name: auth
    description: Token-based authentication — login, refresh rotation, logout (HW #24)
  - name: files
    description: Direct-to-storage uploads (presigned PUT, resumable multipart) and downloads (HW #26)

paths:
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products, paged via an opaque cursor
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
              examples:
                twoProducts:
                  summary: A page of two seeded products, more available
                  value:
                    items:
                      - id: prod_1
                        name: Mechanical keyboard
                        price_cents: 249900
                        created_at: '2026-09-10T12:00:00.000Z'
                      - id: prod_2
                        name: Wireless mouse
                        price_cents: 89900
                        created_at: '2026-09-10T12:00:00.010Z'
                    next_cursor: eyJjcmVhdGVkX2F0IjoiMjAyNi0wOS0xMFQxMjowMDowMC4wMTBaIiwiaWQiOiJwcm9kXzIifQ
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createProduct
      tags: [products]
      summary: Add a product to the catalog — sellers and admins only (HW #24)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProduct'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /products/{productId}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get one product by id
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List the caller's own orders (all orders for an admin), paged via an opaque cursor
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place an order (idempotent by client key) — owned by the caller (the token's subject)
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: >
            A unique key the client generates itself for one logical order
            creation. Repeating the request with the same Idempotency-Key and
            the same body is safe — the server returns the same response it
            produced the first time instead of creating a second order. The
            same key with a different request body is treated as a conflict
            and rejected as 422, since one key cannot mean two different
            operations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '201':
          description: >
            Order created. On a repeat of the same Idempotency-Key with the
            same body, the server returns the same response again and adds
            the `Idempotency-Replay: true` header.
          headers:
            Idempotency-Replay:
              description: 'true if this is not the first creation but a replayed response for the same key'
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                singleItemOrder:
                  summary: An order for one mechanical keyboard
                  value:
                    id: order_1
                    status: created
                    items:
                      - product_id: prod_1
                        quantity: 1
                    total_cents: 249900
                    created_at: '2026-09-10T12:05:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The same Idempotency-Key was reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: >
        Get one order by id — the owner's or, for an admin, anyone's. Another
        buyer's order is 403 (authenticated, not allowed), not 401.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderId}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: >
        Change an order's status. Triggers a realtime notification (HW #18)
        to every client subscribed to this order — via WebSocket (room
        `orders:<id>`) and via the equivalent SSE stream below — not just a
        change to the stored record. Sellers and admins only (HW #24).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrderStatus'
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderId}/events:
    get:
      operationId: streamOrderEvents
      tags: [orders]
      summary: >
        Server-Sent Events stream of this order's status changes (HW #18).
        Not validated against a JSON response schema below — unlike every
        other operation in this spec, this one never produces a single,
        complete response body to validate; it's a long-lived
        `text/event-stream` connection. Registered in app.js BEFORE the
        OpenAPI validator middleware, the same way `/health` is (see
        app.js's own comment) — documented here for completeness, not
        enforced by express-openapi-validator. Supports `Last-Event-ID` for
        resuming after a reconnect; see README's Testing section. Same
        ownership rule as `GET /orders/{orderId}` and the WebSocket join:
        the owner or an admin, identified by the bearer token (HW #24).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: >
            `text/event-stream`. Each event has `id:` (an increasing,
            per-order sequence number), `event: order.status`, and
            `data:` holding `{"status": "<new status>"}` as JSON.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /checkout:
    post:
      operationId: checkout
      tags: [orders]
      summary: >
        The real, Postgres-backed transactional checkout (HW #14) — unlike
        `POST /orders` above, which is HW #9's in-memory variant B. Stock
        and the buyer's balance are decremented atomically in one
        transaction, and the `order.placed` event is written to the
        transactional outbox in that SAME transaction (HW #22) — a relay
        publishes it to RabbitMQ afterwards, at-least-once (see README,
        "Outbox та ідемпотентність").
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: >
            One key = one purchase intent. Repeating the request with the
            same key (a retry after a timeout, a double click) returns the
            order the first request placed instead of placing a second one —
            also when both requests arrive at the same time. The key, not the
            body, is what identifies the intent: two genuinely identical
            orders just use two keys. Keys are scoped per buyer (the token's subject)
            — two buyers using the same key don't collide. Reusing a key for
            a different request by the same buyer is rejected with 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: >
            Order committed together with its order.placed outbox row. On a
            repeat of the same Idempotency-Key, the same order again, with
            `Idempotency-Replay: true`.
          headers:
            Idempotency-Replay:
              description: 'true if this response replays an order an earlier request with this key already placed'
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Not enough stock, or not enough balance — nothing was committed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: This Idempotency-Key was already used for a different checkout request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /product-cards/{productId}:
    get:
      operationId: getProductCard
      tags: [products]
      summary: >
        A product card from Postgres (products.id, unlike `/products`, which
        is HW #9's in-memory variant B): price, live stock and sales
        aggregates. Served through a Redis cache-aside with a jittered TTL
        and a single-flight lock — on a miss, one request per key reads the
        database (HW #23). The stock shown is informational and may lag a
        few minutes; checkout re-checks it atomically.
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]+$'
          description: products.id (bigint, as a string)
      responses:
        '200':
          description: The product card
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /sessions:
    post:
      operationId: createSession
      tags: [sessions]
      summary: >
        Log in (cookie flavour, HW #23): checks e-mail + password with the
        same verifier as `POST /auth/login` (HW #24), creates a session in
        Redis and sets the `sid` cookie (HttpOnly, SameSite=Lax).
        Rate-limited per (client, e-mail); an unknown e-mail is the same 401
        as a wrong password, so this doesn't reveal which addresses exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSession'
      responses:
        '201':
          description: Session created; the token is only in the `Set-Cookie` header, never in the body
          headers:
            Set-Cookie:
              description: '`sid=<opaque token>; HttpOnly; SameSite=Lax; Path=/`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /sessions/current:
    get:
      operationId: getCurrentSession
      tags: [sessions]
      summary: >
        The caller's session. Every request carrying a valid `sid` renews
        the session's idle timeout (rolling TTL); it still ends at an
        absolute cap counted from login.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteCurrentSession
      tags: [sessions]
      summary: Log out — the session is deleted from Redis and the cookie cleared.
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: >
        E-mail + password → an access token (ES256 JWT, 10 min) and an
        opaque refresh token (14 days). Starts a new token family.
        Rate-limited per (client, e-mail); unknown e-mail and wrong
        password are the same 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: A new token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      operationId: refreshTokens
      tags: [auth]
      summary: >
        Rotate: a valid refresh token → a new pair; the presented token is
        retired. Presenting an already-retired token is treated as theft
        (RFC 9700 §4.14.2): the whole family is revoked — the attacker's
        tokens and the honest client's alike — and the response is 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A new token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: >
        Two actions in one transaction: the refresh-token family is revoked,
        and this access token's `jti` is denylisted until its `exp`. After
        this, neither token works.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Who the access token says the caller is
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /uploads/intent:
    post:
      operationId: createUploadIntent
      tags: [files]
      summary: >
        Step 1 of 3 (HW #26). Declares an upload and returns presigned
        URL(s) to PUT the bytes STRAIGHT to object storage — they never pass
        through this API. The server generates the object key
        (`uploads/{user}/{uuid}.{ext}`, extension from the content-type
        allowlist); `filename` is kept for display only and never reaches
        the key. Files above the multipart threshold (10 MiB) get one URL
        per part; the part size is computed (≥ 5 MiB, ≥ size / 10 000).
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: >
            Optional. A repeat with the same key (a double tap) returns the
            SAME file with fresh URLs instead of creating a second object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadIntentRequest'
      responses:
        '200':
          description: The file row (PENDING) and where to PUT its bytes
          headers:
            Idempotency-Replay:
              description: 'true if this repeats an intent made earlier with the same Idempotency-Key'
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadIntent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Larger than this content type allows
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Content type not on the allowlist
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: This Idempotency-Key was already used for a different upload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /uploads/{fileId}/parts:
    get:
      operationId: getUploadParts
      tags: [files]
      summary: >
        The resume point of a multipart upload: asks the STORAGE (ListParts)
        which parts it already holds and presigns only the missing ones. A
        client that crashed mid-upload calls this and sends just the rest.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Parts already stored, and URLs for the missing ones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadParts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not a multipart upload, or already completed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /uploads/commit:
    post:
      operationId: commitUpload
      tags: [files]
      summary: >
        Step 3 of 3. Nothing the client says is trusted: for multipart the
        server completes the upload from the parts the storage reports; then
        HeadObject — the object must exist and have the size declared at
        intent — and the first bytes must match the declared type. Only then
        COMPLETED. Idempotent: committing a completed file returns it again.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '200':
          description: The file, COMPLETED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Nothing (or not everything) was uploaded, or the size differs — a wrong-size object is discarded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The content doesn't match the declared type — the object is discarded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /files/{fileId}:
    get:
      operationId: downloadFile
      tags: [files]
      summary: >
        302 to a fresh presigned GET that lives one minute. A presigned URL
        can't be revoked, so it's never handed out long-lived: this endpoint
        keeps the owner check on every access while the bytes still go
        storage → client directly.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '302':
          description: Redirect to the object (presigned, 60 s)
          headers:
            Location:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Upload not completed yet
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        `Authorization: Bearer <access_token>` from `POST /auth/login` or
        `POST /auth/refresh`. ES256 only — any other `alg` is rejected.
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: Opaque session token set by `POST /sessions`; Redis stores only its SHA-256.

  headers:
    RateLimitLimit:
      description: Requests allowed per window for this client
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left in the current window
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying
      schema:
        type: integer
        minimum: 1

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Maximum number of items per page.

    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: >
        An opaque pagination token taken from the `next_cursor` field of the
        previous response. The token's format is an implementation detail,
        not part of the contract: don't parse or construct it yourself, just
        pass it back exactly as received.

    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
      description: Product identifier.

    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: files.id

    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
      description: Order identifier.

  responses:
    Unauthorized:
      description: >
        Not authenticated: no credentials, or an invalid, expired or revoked
        token / session — or, for a login, wrong credentials. A client
        refreshes (or logs in again) on 401; it never does on 403.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    TooManyRequests:
      description: >
        Rate limit exceeded. The limit is shared by every instance of the
        service (a sliding window in Redis), not counted per process.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    ServiceUnavailable:
      description: >
        The cache entry is being rebuilt by another request and there is no
        stale copy to serve yet — load is shed instead of sent to the
        database. Retry after `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    BadRequest:
      description: Request does not conform to the contract (parameter or body validation)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    NotFound:
      description: No resource with this id exists
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Forbidden:
      description: >
        Authenticated, but not allowed: the resource belongs to someone
        else, or the caller's role isn't enough. Refreshing won't help.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    UploadIntentRequest:
      type: object
      additionalProperties: false
      required: [content_type, size]
      properties:
        filename:
          type: string
          maxLength: 255
          description: Display only — never part of the object key
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp, application/pdf, application/gzip, video/mp4]
        size:
          type: integer
          minimum: 1
          description: Exact size in bytes; signed into the PUT URL and re-checked at commit

    PresignedPart:
      type: object
      additionalProperties: false
      required: [part_number, url, start, end]
      properties:
        part_number:
          type: integer
        url:
          type: string
        start:
          type: integer
          description: First byte of the file in this part
        end:
          type: integer
          description: Last byte of the file in this part (inclusive)

    UploadIntent:
      type: object
      additionalProperties: false
      required: [file_id, key, status, mode, expires_in]
      properties:
        file_id:
          type: string
          format: uuid
        key:
          type: string
          description: Generated by the server — uploads/{user}/{uuid}.{ext}
        status:
          type: string
          enum: [PENDING, COMPLETED]
        mode:
          type: string
          enum: [single, multipart]
        expires_in:
          type: integer
          description: Seconds the URL(s) stay valid
        put:
          type: object
          description: mode=single — PUT the whole file here, with these headers
          additionalProperties: false
          required: [url, headers]
          properties:
            url:
              type: string
            headers:
              type: object
              additionalProperties:
                type: string
        part_size:
          type: integer
        parts_count:
          type: integer
        parts:
          type: array
          description: mode=multipart — one URL per part not yet stored
          items:
            $ref: '#/components/schemas/PresignedPart'

    UploadParts:
      type: object
      additionalProperties: false
      required: [file_id, part_size, parts_count, uploaded, missing, expires_in]
      properties:
        file_id:
          type: string
          format: uuid
        part_size:
          type: integer
        parts_count:
          type: integer
        uploaded:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [part_number, size]
            properties:
              part_number:
                type: integer
              size:
                type: integer
        missing:
          type: array
          items:
            $ref: '#/components/schemas/PresignedPart'
        expires_in:
          type: integer

    CommitRequest:
      type: object
      additionalProperties: false
      required: [file_id]
      properties:
        file_id:
          type: string
          format: uuid

    FileInfo:
      type: object
      additionalProperties: false
      required: [file_id, key, status, content_type, size]
      properties:
        file_id:
          type: string
          format: uuid
        key:
          type: string
        status:
          type: string
          enum: [PENDING, COMPLETED]
        content_type:
          type: string
        size:
          type: integer
        etag:
          type: string
          nullable: true
          description: As reported by the storage. A multipart object's ETag ends in -N and is NOT the file's MD5.

    ProductCard:
      type: object
      additionalProperties: false
      required: [id, name, price_cents, stock, units_sold, orders_count]
      properties:
        id:
          type: string
        name:
          type: string
        price_cents:
          type: integer
        stock:
          type: integer
          description: Informational, may lag by up to the cache TTL
        units_sold:
          type: integer
        orders_count:
          type: integer

    NewSession:
      $ref: '#/components/schemas/Credentials'

    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 200

    TokenPair:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: ES256-signed JWT (header `kid`), short-lived — see `expires_in`
        refresh_token:
          type: string
          description: >
            Opaque random string, NOT a JWT. Single use: every refresh
            returns a new one and retires this one. Presenting a retired
            one again revokes the whole login (all its refresh and access
            tokens) — so a client must never refresh twice in parallel.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access-token lifetime in seconds

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 200

    Me:
      type: object
      additionalProperties: false
      required: [user_id, role, expires_at]
      properties:
        user_id:
          type: string
        role:
          type: string
          enum: [buyer, seller, admin]
          description: As of token issue — a cached copy of the user's role, valid until `expires_at`
        expires_at:
          type: string
          format: date-time

    Session:
      type: object
      additionalProperties: false
      required: [user_id, idle_timeout_seconds]
      properties:
        user_id:
          type: string
        created_at:
          type: string
          format: date-time
        idle_timeout_seconds:
          type: integer
          description: The session expires after this much inactivity; each request resets it

    CheckoutRequest:
      type: object
      additionalProperties: false
      # HW #24: no user_id — the buyer is the bearer token's subject. A body
      # field would let anyone buy (and spend the balance) "as" anyone.
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          pattern: '^[0-9]+$'
          description: products.id (bigint, as a string)
        quantity:
          type: integer
          minimum: 1

    CheckoutResult:
      type: object
      additionalProperties: false
      required: [order_id, total_cents]
      properties:
        order_id:
          type: string
        total_cents:
          type: integer

    Problem:
      type: object
      description: RFC 7807 problem+json — the single error contract of this API.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          description: URI of the error type (a stable identifier for this class of problem).
        title:
          type: string
          description: Short, human-readable name of the error class.
        status:
          type: integer
          description: The HTTP status code, duplicated in the body.
        detail:
          type: string
          description: What exactly went wrong in this specific case.
        instance:
          type: string
          description: A reference (request path) to this specific occurrence of the error.

    Product:
      type: object
      required: [id, name, price_cents, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        price_cents:
          type: integer
          description: Price in cents (integer, not a decimal string and not a float).
          minimum: 0
        created_at:
          type: string
          format: date-time
          description: Used as the secondary sort key for keyset pagination, together with id.

    NewProduct:
      type: object
      required: [name, price_cents]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        price_cents:
          type: integer
          minimum: 0

    ProductPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null means there are no more pages.

    OrderItem:
      type: object
      required: [product_id, quantity]
      additionalProperties: false
      properties:
        product_id:
          type: string
        quantity:
          type: integer
          minimum: 1

    NewOrder:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'

    NewOrderStatus:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [created, paid, shipped, completed, cancelled]

    Order:
      type: object
      required: [id, status, items, total_cents, created_at]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [created, paid, shipped, completed, cancelled]
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total_cents:
          type: integer
          description: Order total in cents (integer).
          minimum: 0
        created_at:
          type: string
          format: date-time

    OrderPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null means there are no more pages.
