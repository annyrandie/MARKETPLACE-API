# Postgres for local development and the password-rotation demo (HW #11),
# fronted by PgBouncer (HW #15) — the app talks to `pgbouncer`, never to `db`
# directly. `db`'s own host port below is a fixed dev convenience (direct
# psql access), unrelated to .env's DB_URL, which now points at PgBouncer's
# port instead (see scripts/up-db.sh, derived the same "one place" way
# DB_HOST_PORT used to be — just aimed at a different service).
name: marketplace-api
services:
  db:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin-bootstrap-only # admin for ALTER ROLE; the app never connects as this user
      POSTGRES_DB: marketplace
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db:/db:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d marketplace']
      interval: 2s
      timeout: 2s
      retries: 15

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    ports:
      - '${PGBOUNCER_HOST_PORT:-6432}:5432'
    # The whole directory, not two single-file binds: rotate.sh rewrites
    # userlist.txt via `sed -i`, which (both GNU and BSD sed) writes a new
    # file and renames it over the old one — a single-file bind mount keeps
    # pointing at the now-unlinked original inode, so the container stops
    # seeing the file at all after the first rotation. A directory mount
    # follows renames inside it.
    volumes:
      - ./pgbouncer:/etc/pgbouncer:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "PGPASSWORD=admin-bootstrap-only psql -h 127.0.0.1 -p 5432 -U admin -d marketplace -c 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Clean restore target for scripts/restore-drill.sh (HW #15, step 8 of
  # lecture 15's ladder). Only comes up with `--profile drill`; the drill
  # script itself destroys and recreates both this container and its volume
  # on every run, so a drill never restores into leftover data.
  restore:
    image: postgres:16-alpine
    profiles: ['drill']
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin-bootstrap-only
      POSTGRES_DB: marketplace
    volumes:
      - pgdata-restore:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d marketplace']
      interval: 2s
      timeout: 2s
      retries: 15

  # Pact Broker (HW #16) — "the contract lives in the broker, not in the
  # consumer's repo". Both come up by default with the rest of the stack
  # (no profile): the acceptance walkthrough's first step is a bare
  # `docker compose up -d --wait`.
  pact-broker-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      POSTGRES_DB: broker
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U broker -d broker']
      interval: 2s
      timeout: 2s
      retries: 15

  pact-broker:
    image: pactfoundation/pact-broker:2.142.0-pactbroker2.120.0
    ports:
      - '${PACT_BROKER_HOST_PORT:-9292}:9292'
    environment:
      PACT_BROKER_DATABASE_URL: postgres://broker:broker@pact-broker-db/broker
      PACT_BROKER_ALLOW_PUBLIC_READ: 'true'
    depends_on:
      pact-broker-db:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, НЕ localhost: усередині контейнера localhost може
      # резолвитись у ::1, а puma слухає лише IPv4.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9292/diagnostic/status/heartbeat']
      interval: 3s
      timeout: 3s
      retries: 30

  # RabbitMQ (HW #19) — the broker IS the point of this HW, not a tool
  # borrowed to demo something else. 4.2.x: commercial-support LTS series
  # through 2030-06-30 — the "which version did you ship" answer. The
  # -management image, not the bare one: without it there's no UI to look
  # at x-death headers by eye while building the DLQ demo.
  rabbitmq:
    image: rabbitmq:4.2-management
    ports:
      - '${RABBITMQ_AMQP_HOST_PORT:-5672}:5672'   # AMQP — what the app and demo scripts actually connect to
      - '${RABBITMQ_UI_HOST_PORT:-15672}:15672'   # management UI only; NOT an AMQP port
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    healthcheck:
      # Not "is the TCP port open": there's a real window between the port
      # accepting connections and the Erlang node actually being ready to
      # run basic.publish, and a client landing in it gets ECONNRESET.
      # rabbitmq-diagnostics asks the node itself whether it's up.
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 3s
      timeout: 5s
      retries: 30

  # Redis (HW #23) — TWO instances, not one with SELECT 1: maxmemory and
  # maxmemory-policy are per-process settings, and a cache and a queue need
  # opposite ones. Bound to 127.0.0.1 only: no auth on these dev boxes, so
  # they must not be reachable from the LAN.
  #
  # redis-cache: a cache MUST be allowed to forget. Capped memory +
  # allkeys-lru means "full" quietly evicts the coldest keys instead of
  # failing writes (the stock config is maxmemory 0 + noeviction, i.e. a
  # cache that one day starts throwing OOM at every SET). No persistence —
  # a cache restarted empty is still a correct cache, just a cold one.
  redis-cache:
    image: redis:8.4-alpine
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ''
      - --appendonly
      - 'no'
    ports:
      - '127.0.0.1:${REDIS_CACHE_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15

  # redis-queue: BullMQ state + sessions + rate-limit counters — data that
  # must NOT silently disappear. noeviction (BullMQ's docs: it "cannot work
  # properly if Redis evicts keys arbitrarily"); when full, writes fail
  # loudly instead of a random job/session vanishing. AOF everysec: a
  # restart loses at most ~1s of writes, not the whole queue.
  redis-queue:
    image: redis:8.4-alpine
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    ports:
      - '127.0.0.1:${REDIS_QUEUE_HOST_PORT:-6380}:6379'
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata-restore:
  redis-queue-data:
