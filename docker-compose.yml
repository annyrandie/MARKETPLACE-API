# Postgres for local development and the password-rotation demo (HW #11).
# The app itself runs on the host (`npm start`), not as a compose service.
# DB_HOST_PORT is exported by scripts/up-db.sh, derived from .env's DB_URL —
# the port lives in one place (DB_URL) instead of being repeated here too.
name: marketplace-api
services:
  db:
    image: postgres:16-alpine
    ports:
      - '${DB_HOST_PORT:-5433}:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin-bootstrap-only # admin for ALTER ROLE; the app never connects as this user
      POSTGRES_DB: marketplace
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db:/db:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d marketplace']
      interval: 2s
      timeout: 2s
      retries: 15
