;; PgBouncer in front of the `db` service (HW #15). pool_mode = transaction
;; is the whole point: the app "holds" a connection to PgBouncer, but the
;; real Postgres backend connection is handed out only for the lifetime of
;; one transaction, then returned to the pool — max_client_conn clients can
;; share default_pool_size real backend connections. See README's
;; "PgBouncer transaction mode" section for what that trades away.

[databases]
marketplace = host=db port=5432 dbname=marketplace

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
default_pool_size = 8
max_client_conn = 200

;; Transaction mode drops a client's *named* prepared statements the moment
;; its transaction ends (they lived on one backend, the next transaction may
;; land on another). PgBouncer >= 1.21 can track and re-prepare them itself
;; instead of erroring — 200 is this project's node-postgres driver never
;; actually needing it (pg uses unnamed statements by default), kept as
;; headroom per the assignment's own hint, not because anything here relies
;; on it today.
max_prepared_statements = 200

;; admin console: psql -p <host port> -U admin -d pgbouncer -c "SHOW POOLS"
;; `admin` is the same bootstrap role docker-compose.yml already defines for
;; the `db` service (POSTGRES_USER) — no new role, no new secret.
admin_users = admin
stats_users = admin

ignore_startup_parameters = extra_float_digits
